<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fördora{% endblock %}</title>
  <meta name="description" content="Fördora ist ein Prototyp mit Testdaten zu Förderprogrammen. Angaben und Fristen können unvollständig oder veraltet sein; bitte bei der Förderstelle prüfen.">
  <link rel="stylesheet" href="/static/style.css?v=20261027a">
</head>
<body>
<header>
  <a class="logo" href="/">
    <span class="mark">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/>
      <circle cx="12" cy="12" r="3.4" fill="#fff" stroke="none"/></svg>
    </span>Fördora<small style="font-size:11px;font-weight:500;opacity:.6;margin-left:2px;align-self:flex-end;padding-bottom:3px">Testversion</small>
  </a>
  <nav>
    <a href="/#wie">Wie es funktioniert</a>
    <a href="/#vorteile">Vorteile</a>
    <a href="/datenschutz">Datenschutz</a>
    <a class="btn btn-p" style="padding:11px 20px;font-size:15px" href="/formular">Jetzt starten</a>
  </nav>
</header>

{% block content %}{% endblock %}

<footer>
  <a href="/impressum">Impressum</a>
  <a href="/datenschutz">Datenschutz</a>
  <a href="mailto:team@foerdora.cloud">Kontakt: team@foerdora.cloud</a>
  <span style="float:right">© 2026 Fördora · <span style="opacity:.7">v1.0 alpha (Testversion)</span></span>
</footer>
</body>
</html>
