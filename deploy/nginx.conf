# FoerderRadar - Reverse Proxy (nginx + certbot)
#
# Alternative zu Caddy. Laeuft auf dem HOST, nicht im Container.
#
# Installation:
#   apt install nginx certbot python3-certbot-nginx
#   cp deploy/nginx.conf /etc/nginx/sites-available/foerdora
#   ln -s /etc/nginx/sites-available/foerdora /etc/nginx/sites-enabled/foerdora
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d foerdora.cloud          # holt das Zertifikat, ergaenzt ssl_*
#
# Voraussetzung: TCP 80 + 443 offen (hPanel-Firewall UND "ufw allow 80,443/tcp").

server {
    listen 80;
    listen [::]:80;
    server_name foerdora.cloud;

    # certbot nutzt diesen Block fuer die HTTP-01-Challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name foerdora.cloud;

    # Von certbot verwaltet:
    ssl_certificate     /etc/letsencrypt/live/foerdora.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foerdora.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ------------------------------------------------------------------
    # ENTWICKLUNGSPHASE: Zugang nur mit Passwort.
    #   htpasswd -c /etc/nginx/.htpasswd balu
    # Dann die drei Zeilen einkommentieren, nginx -t, reload.
    # Beim Go-Live wieder auskommentieren.
    # ------------------------------------------------------------------
    #auth_basic           "FoerderRadar (Dev)";
    #auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/foerdora.access.log;
    error_log  /var/log/nginx/foerdora.error.log;
}
