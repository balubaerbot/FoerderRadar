# FoerderRadar - nginx, LIVE (Stand Go-Live 2026-10-31).
#
# Liegt auf dem HOST unter /etc/nginx/sites-available/foerdora
# (Symlink in sites-enabled). Diese Datei ist der aktuelle Live-Stand.
#
# - Port 80: nur ACME-Challenge + Redirect auf HTTPS.
# - Port 443: TLS (Let's Encrypt via certbot), App per proxy_pass auf
#   127.0.0.1:8100 (Container lauscht nur lokal).
#
# Aenderung ausrollen: Datei auf den Host kopieren, `nginx -t`, dann
# `systemctl reload nginx`. Vorher Backup der alten Datei ziehen.
# Zurueck in die Dev-Phase (Tor zu): Backup
# /root/foerdora.nginx.devphase.20261031_165312.bak zurueckspielen.

server {
    listen 80;
    listen [::]:80;
    server_name foerdora.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Platzhalterseite, kein Proxy zur App ----------------------------
server {
    # nginx 1.24 (Ubuntu): http2 gehoert an "listen", NICHT als eigene
    # Direktive ("http2 on;" gibt es erst ab nginx 1.25.1 -> emerg-Fehler).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foerdora.cloud;

    ssl_certificate     /etc/letsencrypt/live/foerdora.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foerdora.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Certbot braucht diesen Pfad auch auf 443.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # GO-LIVE: App durchreichen (Container lauscht nur auf 127.0.0.1:8100).
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/foerdora.access.log;
    error_log  /var/log/nginx/foerdora.error.log;
}
