# FoerderRadar - Reverse Proxy (nginx + certbot)
#
# Laeuft auf dem HOST, nicht im Container.
# Bewusst OHNE Drittanbieter-Repo: nginx und certbot kommen aus den
# offiziellen Ubuntu-Quellen (kein Cloudsmith-Schluessel, keine Ueberraschungen).
#
# ABLAUF (Reihenfolge einhalten):
#   1) apt install -y nginx certbot python3-certbot-nginx
#   2) cp deploy/nginx.conf /etc/nginx/sites-available/foerdora
#      ln -sf /etc/nginx/sites-available/foerdora /etc/nginx/sites-enabled/foerdora
#      rm -f /etc/nginx/sites-enabled/default
#   3) nginx -t && systemctl reload nginx
#   4) certbot --nginx -d foerdora.cloud
#      -> certbot ergaenzt TLS selbst und baut den 80->443-Redirect ein.
#
# Wichtig: Diese Datei ist die PHASE-1-Fassung (nur Port 80). Sie laedt
# fehlerfrei, BEVOR ein Zertifikat existiert. Ein ssl_certificate-Verweis auf
# eine noch nicht existierende Datei wuerde "nginx -t" sofort scheitern lassen.

server {
    listen 80;
    listen [::]:80;
    server_name foerdora.cloud;

    # Muss ohne Auth erreichbar bleiben, sonst scheitert certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # ------------------------------------------------------------------
        # ENTWICKLUNGSPHASE: Zugang nur mit Passwort.
        #   htpasswd -c /etc/nginx/.htpasswd balu
        # Dann die beiden Zeilen einkommentieren, nginx -t, reload.
        # Bewusst INNERHALB von "location /" - der ACME-Pfad oben bleibt frei.
        # Beim Go-Live wieder auskommentieren.
        # ------------------------------------------------------------------
        #auth_basic           "FoerderRadar (Dev)";
        #auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/foerdora.access.log;
    error_log  /var/log/nginx/foerdora.error.log;
}

# ---------------------------------------------------------------------------
# PHASE 2 - nur zur Information, wird von certbot automatisch erzeugt.
# Nach "certbot --nginx -d foerdora.cloud" sieht der Block ungefaehr so aus:
