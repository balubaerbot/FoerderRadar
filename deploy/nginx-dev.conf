# FoerderRadar - nginx, DEV-PHASE: Tor zu.
#
# Auf dem HOST unter /etc/nginx/sites-available/foerdora ablegen.
#
# Zweck: Die Domain foerdora.cloud soll waehrend der Entwicklung KEINEN
# oeffentlichen Inhalt zeigen. nginx liefert nur die Platzhalterseite.
# Die App wird NICHT mehr durchgereicht -> ihr Formular/Backend ist von
# aussen nicht erreichbar (der Container hoert ohnehin nur auf 127.0.0.1:8100).
#
# Wechsel zum Go-Live: deploy/nginx.conf (Proxy-Variante) kopieren, reload.
#
# Voraussetzung: Zertifikat existiert bereits (certbot --nginx -d foerdora.cloud).
# ACME-Pfad bleibt offen, damit die Zertifikatserneuerung weiter funktioniert.

# --- HTTP: nur ACME + Redirect auf HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name foerdora.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Platzhalterseite, kein Proxy zur App ----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name foerdora.cloud;

    ssl_certificate     /etc/letsencrypt/live/foerdora.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foerdora.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Certbot braucht diesen Pfad auch auf 443.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # DEV-PHASE: nur statischer Platzhalter, KEIN proxy_pass.
    root  /var/www/foerdora-dev;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/foerdora.access.log;
    error_log  /var/log/nginx/foerdora.error.log;
}
