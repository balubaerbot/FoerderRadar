<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text{fill:#172033}
    .title{font-size:21px;font-weight:700}
    .sub{font-size:12px;fill:#5b6475}
    .label{font-size:14px;font-weight:600}
    .small{font-size:11.5px;fill:#5b6475}
    .node{stroke:#64748b;stroke-width:1}
    .input{fill:#bfdbfe}
    .process{fill:#c7d2fe}
    .storage{fill:#99f6e4}
    .external{fill:#fde68a}
    .risk{fill:#fecaca}
    .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#64748b;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .edge-red{stroke:#dc2626;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
  </style>

  <!-- Titel -->
  <text class="title" x="40" y="38">FoerderRadar — Datenfluss (Ist-Stand)</text>
  <text class="sub" x="40" y="58">Matching-Job aktiv · 27.09.2026 · pseudonyme Profildaten und Klartext-Kontaktdaten strikt getrennt</text>

  <!-- ===== Kanten (hinter den Boxen) ===== -->
  <path class="edge" d="M 190 158 H 276" marker-end="url(#arrow)"/>
  <path class="edge" d="M 190 278 H 276" marker-end="url(#arrow)"/>
  <path class="edge" d="M 490 146 H 576" marker-end="url(#arrow)"/>
  <path class="edge-red" d="M 490 172 L 576 228" marker-end="url(#arrow-red)"/>
  <path class="edge" d="M 490 266 L 576 316" marker-end="url(#arrow)"/>
  <path class="edge" d="M 490 292 L 576 396" marker-end="url(#arrow)"/>
  <path class="edge" d="M 760 176 V 286" marker-end="url(#arrow)"/>
  <path class="edge-red" d="M 760 256 V 530 H 470 V 556" marker-end="url(#arrow-red)"/>
  <path class="edge-dash" d="M 760 426 V 530"/>
  <path class="edge-dash" d="M 490 595 H 576" marker-end="url(#arrow)"/>

  <!-- ===== Kanten-Labels ===== -->
  <text class="small" x="235" y="122" text-anchor="middle">Profil + Kontakt anlegen</text>
  <text class="small" x="235" y="242" text-anchor="middle">Regeln laden</text>
  <text class="small" x="528" y="140" text-anchor="middle">INSERT</text>
  <text class="small" x="528" y="200" text-anchor="middle">INSERT</text>
  <text class="small" x="528" y="282" text-anchor="middle">SELECT</text>
  <text class="small" x="528" y="352" text-anchor="middle">INSERT</text>
  <text class="small" x="766" y="234">VIEW</text>
  <text class="small" x="764" y="480">geplant</text>
  <text class="small" x="533" y="588" text-anchor="middle">Mail/SMS</text>

  <!-- ===== Externe / Eingaben ===== -->
  <rect class="node input" x="40" y="130" width="150" height="56" rx="8"/>
  <text class="label" x="115" y="156" text-anchor="middle">Kunde / Client</text>
  <text class="small" x="115" y="174" text-anchor="middle">Erfassung</text>

  <rect class="node external" x="40" y="250" width="150" height="56" rx="8"/>
  <text class="label" x="115" y="276" text-anchor="middle">Katalog (JSON)</text>
  <text class="small" x="115" y="294" text-anchor="middle">13 Foerderungen</text>

  <!-- ===== Prozesse (API) ===== -->
  <rect class="node process" x="280" y="130" width="210" height="56" rx="8"/>
  <text class="label" x="385" y="156" text-anchor="middle">POST /profile</text>
  <text class="small" x="385" y="174" text-anchor="middle">Profil + Kontakt speichern</text>

  <rect class="node process" x="280" y="250" width="210" height="56" rx="8"/>
  <text class="label" x="385" y="276" text-anchor="middle">Matching</text>
  <text class="small" x="385" y="294" text-anchor="middle">POST /match/{kunde_id}</text>

  <!-- ===== Datenhaltung (Postgres) ===== -->
  <rect class="node storage" x="580" y="120" width="360" height="56" rx="8"/>
  <text class="label" x="600" y="145">profil</text>
  <text class="small" x="600" y="163">pseudonym · Agent/Dienst lesbar</text>

  <rect x="580" y="200" width="360" height="56" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text class="label" x="600" y="225">kontakt</text>
  <text class="small" x="600" y="243" fill="#7f1d1d">KLARTEXT (name/email/tel) — nur Versand-Worker</text>

  <rect class="node storage" x="580" y="290" width="360" height="56" rx="8"/>
  <text class="label" x="600" y="315">profil_agent (VIEW)</text>
  <text class="small" x="600" y="333">pseudonyme Sicht · Agent/Dienst lesbar</text>

  <rect class="node storage" x="580" y="370" width="360" height="56" rx="8"/>
  <text class="label" x="600" y="395">match</text>
  <text class="small" x="600" y="413">eingefrorene Treffer (top / pruefenswert)</text>

  <!-- ===== Geplant: Versand ===== -->
  <rect class="node risk" x="280" y="558" width="210" height="74" rx="8" stroke-dasharray="6 4"/>
  <text class="label" x="385" y="592" text-anchor="middle">Versand-Worker</text>
  <text class="small" x="385" y="610" text-anchor="middle">(geplant) · kontakt + match</text>

  <rect class="node external" x="580" y="558" width="180" height="74" rx="8"/>
  <text class="label" x="670" y="592" text-anchor="middle">Kunde</text>
  <text class="small" x="670" y="610" text-anchor="middle">E-Mail / SMS</text>

  <!-- ===== Legende ===== -->
  <rect class="node input" x="40" y="652" width="14" height="14" rx="3"/>
  <text class="small" x="60" y="664">Eingabe</text>
  <rect class="node process" x="130" y="652" width="14" height="14" rx="3"/>
  <text class="small" x="150" y="664">Verarbeitung</text>
  <rect class="node storage" x="255" y="652" width="14" height="14" rx="3"/>
  <text class="small" x="275" y="664">Datenhaltung</text>
  <rect class="node risk" x="375" y="652" width="14" height="14" rx="3"/>
  <text class="small" x="395" y="664">Klartext (sensibel)</text>
  <rect class="node external" x="525" y="652" width="14" height="14" rx="3"/>
  <text class="small" x="545" y="664">extern / geplant</text>
  <text class="small" x="40" y="700">gestrichelt = (noch) nicht gebaut</text>
</svg>
